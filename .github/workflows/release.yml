name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 0.1.0)'
        required: true

permissions:
  contents: read

# Two releases at once would race for the same draft and tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The rolling draft Release Drafter maintains; its notes become the release notes.
  DRAFT_TAG: vNext

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Validate the version and make sure the tag is free
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # Checked before anything is built: the tag is created at the end, and finding
        # out that it is taken after a full build wastes the run.
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a version like 0.1.0 or 1.2.0-rc.1."
            exit 1
          fi

          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing Takt ${VERSION} as ${tag}"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            extension: '.exe'
          - rid: linux-x64
            extension: ''

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Takt.slnx --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Takt.App/Takt.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          -p:Version=${{ needs.check.outputs.version }}
          --output artifacts/publish

      - name: Name the binary after its version and platform
        shell: bash
        run: |
          mkdir -p artifacts/release
          cp "artifacts/publish/Takt${{ matrix.extension }}" \
             "artifacts/release/Takt-${{ needs.check.outputs.version }}-${{ matrix.rid }}${{ matrix.extension }}"
          ls -lh artifacts/release

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Takt-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Tag and release ${{ needs.check.outputs.tag }}
    needs: [check, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release and tag the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        # `gh release create --target` creates the tag on that commit, so the tag only
        # comes into existence once both binaries are built.
        run: |
          ls -lh artifacts

          notes=""
          if [ "$(gh release view "${DRAFT_TAG}" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release view "${DRAFT_TAG}" --json body --jq .body > draft-notes.md
            if [ -s draft-notes.md ]; then
              notes="draft-notes.md"
              echo "Using the notes from the ${DRAFT_TAG} draft."
            fi
          fi

          if [ -n "${notes}" ]; then
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --notes-file "${notes}" \
              artifacts/*
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --generate-notes \
              artifacts/*
          fi

          # Only now that the release exists: the draft has served its purpose, and
          # Release Drafter starts a fresh one on the next push to main. Its own tag
          # was never created, so nothing but the draft goes away.
          if [ -n "${notes}" ]; then
            gh release delete "${DRAFT_TAG}" --yes
          fi
